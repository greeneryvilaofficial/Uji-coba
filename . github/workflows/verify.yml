name: Verify (tes cepat, tanpa keystore & tanpa secret)

# Jalan di setiap push dan pull request, ~30 detik. Tidak membangun APK dan tidak butuh secret apa pun,
# jadi siapa pun (termasuk juri) bisa melihat centang hijau/merah tanpa menunggu build Android.
on:
  push:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      # Tanpa `cache: npm`/`cache: gradle`: keduanya GAGAL kalau package-lock.json / berkas gradle tidak ada di repo.
      # (Tidak ada dependensi yang perlu dipasang untuk tes: semuanya Node murni.)
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Tes (AI offline, panel, terjemah, pemutar lagu, Lirik AI, kebersihan repo + simulasi patch Android)
        run: npm test
      - name: Kompilasi berkas Java di native-patches/ (terhadap stub Android; tanpa peringatan)
        run: node tools/java-check.js
